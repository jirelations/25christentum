- id: hutterReligionenImKaukasus2025
  abstract: >-
    Die Kaukasus-Region zeichnet sich durch eine hohe Vielfalt sprachlicher,
    ethnischer, kultureller und religiöser Traditionen aus - abhängig von der
    Geographie und den soziohistorischen Kontexten. Der Sammelband erschließt
    diese Vielfalt in ihren historisch pluralen Religionsformen sowie
    lokalspezifischen Transformationsprozessen über die Jahrhunderte hinweg:
    Lokale Religionspraktiken wurden bereits im Altertum durch Einflüsse aus dem
    Alten Orient, dem Iran und aus Griechenland geprägt; auch die
    christianisierten bzw. islamisierten Regionen des Kaukasus sowie jüdische
    Gruppen zeigen ihre eigenständige Entwicklung. Dieser Pluralismus von
    religiösen Traditionen charakterisiert auch die Religionspolitiken der
    post-sowjetischen Staaten Armenien, Aserbeidschan und Georgien.
  author:
