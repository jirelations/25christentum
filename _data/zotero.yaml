- id: ormaneanDictionaryArmenianChurch1984
  abstract: >-
    "The Armenian language is rich with ecclesiastical terminology. ...
    Archbishop Malachia Ormanian perceived a need to make this vast knowledge
    accessible to the faithful. Ormanian explains that he has purposely
    refrained from writing a scholarly work but rather a concise and explicit
    description of ecclesiastical terminology to which the faithful are often
    exposed but do not necessarily comprehend. His language is in the
    vernacular; his descriptions concise and enlightening. In 1905 Archbishop
    Ormanian made his Ecclesiastical Dictionary available to the public, thus
    completing this monumental task. ... No less monumental was the task of
    translating Ormanian's work into English. Bedros Norehad has captured the
    spirit of Archbishop Ormanian. His language, like that of the author, is
    clear and his descriptions concise. ... The Mother Church has changed as a
    result of the Genocide, the Diaspora and the society around us and the
    translator has reflected the change without detracting from the intent of
    the original. This is not an academic work nor was it intended to be, yet as
    a reference for members of the Armenian Church and other interested
    individuals it is a storehouse of ecclesiastical knowledge."--From foreword.
  author:
