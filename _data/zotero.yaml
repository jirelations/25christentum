- id: mayMarcionUndSeine2013
  abstract: >-
    Der Band versammelt neue Forschungsbeiträge zu Marcion, dem bedeutendsten
    Ketzer der christlichen Antike, und setzt sich dabei insbesondere mit Adolf
    von Harnacks epochaler Marcioninterpretation auseinander. Harnacks Bild von
    Marcion als eines biblizistischen Theologen und treuen Paulusschülers, der
    den theologischen Entwicklungen des 2. Jahrhunderts fremd gegenübersteht,
    hat sich als historisch fragwürdige Modernisierung erwiesen. Die einzelnen
    Beiträge des Bandes ordnen Marcion und die marcionitische Kirche wieder in
    ihren historischen Kontext ein. Erstmals werden auch die
    theologiegeschichtlichen Hintergründe der Marciondeutung Harnacks und ihre
    Rezeption im 20. Jahrhundert gründlicher beleuchtet.
  author:
